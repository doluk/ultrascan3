name: /format command
# Comment "/format" on a pull request to let the bot apply the code style fixes
# (scripts/check-format.sh --fix) to the changed lines and push them to the PR branch.
on:
  issue_comment:
    types: [ created ]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: format-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  format:
    name: apply code style fixes
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/format') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check permission of the commenter
        id: perm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          level=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission" --jq .permission)
          echo "permission: $level"
          case "$level" in admin|maintain|write) ;; *) echo "::error::only users with write access may use /format"; exit 1 ;; esac

      - name: Look up the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" > pr.json
          echo "head_repo=$(jq -r .head.repo.full_name pr.json)" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(jq -r .head.ref pr.json)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r .head.sha pr.json)" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r .base.ref pr.json)" >> "$GITHUB_OUTPUT"
          echo "state=$(jq -r .state pr.json)" >> "$GITHUB_OUTPUT"

      - name: Refuse unsupported pull requests
        if: ${{ steps.pr.outputs.head_repo != github.repository || steps.pr.outputs.state != 'open' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body \
            "/format can only push to open pull requests from branches of this repository. For fork PRs download the \`code-style-fixes.patch\` artifact of the *Code Style* run and apply it with \`git apply\`, or run \`scripts/check-format.sh --fix origin/${{ steps.pr.outputs.base_ref }}\` locally.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          exit 1

      # Security: this workflow runs with write permission, so only trusted code from the
      # default branch is executed (scripts/). The pull request is just data for clang-format.
      - name: Checkout trusted tools (default branch)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Checkout pull request branch
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_ref }}
          path: pr
          fetch-depth: 0
          # a PAT/app token (secret FORMAT_PUSH_TOKEN) makes the pushed commit trigger the CI checks again;
          # pushes made with the default GITHUB_TOKEN do not start new workflow runs
          token: ${{ secrets.FORMAT_PUSH_TOKEN || github.token }}

      - name: Install clang-format 18 and pygments
        run: sudo apt-get update && sudo apt-get install -y clang-format-18 python3-pygments

      - name: Apply fixes
        id: fix
        working-directory: pr
        env:
          CLANG_FORMAT: clang-format-18
          GIT_CLANG_FORMAT: git-clang-format-18
        run: |
          git fetch origin "${{ steps.pr.outputs.base_ref }}"
          BASE=$(git merge-base HEAD "origin/${{ steps.pr.outputs.base_ref }}")
          "$GITHUB_WORKSPACE/trusted/scripts/check-format.sh" --fix "$BASE" || true
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # whatever is left cannot be fixed automatically
          "$GITHUB_WORKSPACE/trusted/scripts/check-conventions.py" "$BASE" > ../remaining.txt 2>&1 || true

      - name: Commit and push
        if: steps.fix.outputs.changed == 'true'
        working-directory: pr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply clang-format to changed lines (/format)"
          git push origin "HEAD:${{ steps.pr.outputs.head_ref }}"

      - name: Resolve fixed suggestions
        if: steps.fix.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$GITHUB_WORKSPACE/trusted/scripts/resolve-suggestion-threads.py" \
            "${{ github.repository }}" "${{ github.event.issue.number }}" "$GITHUB_WORKSPACE/pr"

      - name: Report
        if: always() && steps.fix.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.fix.outputs.changed }}" = true ]; then
            msg="Applied the code style fixes to the changed lines and pushed them to \`${{ steps.pr.outputs.head_ref }}\`."
          else
            msg="Nothing to format: the changed lines already follow the code style."
          fi
          if [ -s remaining.txt ] && grep -q ':' remaining.txt; then
            msg="$msg

          Remaining issues that need a manual fix:
          \`\`\`
          $(head -c 4000 remaining.txt)
          \`\`\`"
          fi
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$msg

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
